<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops Wiki</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header id="topbar">
    <div class="topbar-left">
      <svg class="topbar-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <h1 class="topbar-title">Ops Wiki</h1>
    </div>
    <div class="topbar-right">
      <span id="user-info" class="user-info"></span>
      <button id="btn-admin" class="btn btn-sm btn-admin" style="display:none">用户管理</button>
      <button id="btn-logout" class="btn btn-sm btn-logout" style="display:none">登出</button>
    </div>
  </header>

  <!-- Main Content -->
  <div id="main-container">
    <!-- Left Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="sidebar-search">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-tree" placeholder="搜索文档..." />
        </div>
      </div>
      <div id="tree-container">
        <div class="tree-placeholder">暂无文档</div>
      </div>
    </aside>

    <!-- Right Editor Area -->
    <main id="editor-area">
      <!-- Share recipients bar -->
      <div id="share-bar" style="display:none"></div>

      <!-- Toolbar Row -->
      <div id="toolbar">
        <div class="toolbar-left">
          <div class="highlight-wrapper">
            <svg class="highlight-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="highlight-input" placeholder="高亮关键词..." />
          </div>
        </div>
        <div class="toolbar-right">
          <span id="save-status" class="save-status"></span>
          <span id="readonly-badge" class="readonly-badge" style="display:none">只读</span>
          <button id="btn-save" class="btn btn-save" disabled>保存</button>
        </div>
      </div>

      <!-- Split Editor Container -->
      <div id="editor-container">
        <div id="editor-placeholder" class="editor-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin-bottom:16px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <p>选择一个节点进行编辑</p>
          <p class="editor-placeholder-hint">左键选择 · 右键操作</p>
        </div>
        <div id="split-editor" style="display:none; height: 100%;">
          <div id="markdown-pane" class="split-pane">
            <div class="pane-label">Markdown</div>
            <textarea id="markdown-editor" spellcheck="false"></textarea>
          </div>
          <div id="split-divider" class="split-divider">
            <div class="divider-handle"></div>
          </div>
          <div id="html-pane" class="split-pane">
            <div class="pane-label">HTML 预览</div>
            <div id="html-preview" style="flex:1;overflow-y:auto;padding:20px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Auth Overlay -->
  <div id="auth-overlay" class="overlay">
    <div class="modal" id="login-modal">
      <div class="auth-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <h2>登录 Ops Wiki</h2>
      <form id="login-form">
        <div class="form-field">
          <input type="email" id="login-email" placeholder="邮箱" required />
        </div>
        <div class="form-field">
          <input type="password" id="login-password" placeholder="密码" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">登录</button>
        <p class="auth-error" id="login-error"></p>
        <p class="auth-switch">没有账号？<a href="#" id="show-register">注册账号</a></p>
      </form>
    </div>
    <div class="modal" id="register-modal" style="display:none">
      <div class="auth-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <h2>注册账号</h2>
      <form id="register-form">
        <div class="form-field">
          <input type="email" id="reg-email" placeholder="邮箱" required />
        </div>
        <div class="form-field">
          <input type="password" id="reg-password" placeholder="密码（至少6位）" required />
        </div>
        <div class="form-field">
          <input type="text" id="reg-nickname" placeholder="昵称（选填）" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">注册</button>
        <p class="auth-error" id="register-error"></p>
        <p class="auth-switch">已有账号？<a href="#" id="show-login">返回登录</a></p>
      </form>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="admin-overlay" class="overlay" style="display:none">
    <div class="modal modal-wide" id="admin-modal">
      <div class="modal-header">
        <h2>用户管理</h2>
        <button id="btn-close-admin" class="btn-close">&times;</button>
      </div>
      <div id="admin-user-list" class="admin-user-list-scroll"></div>
    </div>
  </div>

  <!-- Loading Toast -->
  <div id="toast" class="toast" style="display:none"></div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu" style="display:none">
    <div class="context-menu-item" data-action="add-child">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      新增子节点
    </div>
    <div class="context-menu-item" data-action="import">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导入 Markdown
    </div>
    <div class="context-menu-item" data-action="rename">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      重命名
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item context-menu-item--danger" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除节点
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="batch-authorize">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      批量授权
    </div>
    <div class="context-menu-item" data-action="batch-revoke">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      批量撤销
    </div>
    <div class="context-menu-item" data-action="transfer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      权限转让
    </div>
  </div>

  <!-- Empty Space Context Menu (for root-level add) -->
  <div id="empty-context-menu" class="context-menu" style="display:none">
    <div class="context-menu-item" data-action="add-root">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      新增根文档
    </div>
  </div>

  <!-- Batch Dialog -->
  <div id="batch-dialog" class="overlay" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3 class="batch-dialog-title">批量授权</h3>
        <button class="btn-close" onclick="document.getElementById('batch-dialog').style.display='none'">&times;</button>
      </div>
      <div id="batch-user-list" class="user-checklist"></div>
      <label class="recursive-label" id="batch-recursive-label">
        <input type="checkbox" id="batch-recursive" /> 包含所有子节点
      </label>
      <button id="btn-batch-save" class="btn btn-primary btn-full" style="margin-top:16px">确认</button>
    </div>
  </div>

  <!-- Transfer Dialog -->
  <div id="transfer-dialog" class="overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>权限转让</h3>
        <button class="btn-close" onclick="document.getElementById('transfer-dialog').style.display='none'">&times;</button>
      </div>
      <p class="dialog-hint">转让后该文章所有权将转移给目标用户</p>
      <select id="transfer-user-select" class="dialog-select"></select>
      <label class="recursive-label" id="transfer-recursive-label">
        <input type="checkbox" id="transfer-recursive" /> 包含所有子节点
      </label>
      <button id="btn-transfer-confirm" class="btn btn-primary btn-full" style="margin-top:20px">确认转让</button>
    </div>
  </div>

  <!-- Rename Dialog -->
  <div id="rename-dialog" class="overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>重命名节点</h3>
        <button class="btn-close" onclick="document.getElementById('rename-dialog').style.display='none'">&times;</button>
      </div>
      <div class="form-field">
        <input type="text" id="rename-input" placeholder="输入新标题" />
      </div>
      <button id="btn-rename-confirm" class="btn btn-primary btn-full" style="margin-top:16px">确认</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/marked.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/editor.js"></script>
  <script src="/static/js/tree.js"></script>
  <script src="/static/js/app.js"></script>

</body>
</html>
